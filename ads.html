<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>광고 — The Belle City Herald-Tribune</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Black+Han+Sans&family=Gaegu:wght@400;700&family=Song+Myung&display=swap" />
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="ads">

<div class="bn-wrap">
  <div class="bn-paper">

    <div id="bn-header"></div>

    <p class="bn-section-title">📣 광고</p>
    <p class="bn-section-desc">벨 누아 안내 광고</p>

    <div class="bn-card-list">

      <div class="bn-flyer" style="transform:rotate(0.4deg);">
        <div class="bn-tape" style="left:24px; transform:rotate(-3deg);"></div>
        <h3>👗 벨벳 앤 레이스 양장점</h3>
        <p>가을 신상 원단 입고! 이번 달 생일이신 분들께는 10% 할인!</p>
      </div>

      <div class="bn-flyer" style="transform:rotate(-0.3deg);">
        <div class="bn-tape" style="right:30px; left:auto; transform:rotate(2deg);"></div>
        <h3>🕰️ 르누아</h3>
        <p>태엽시계 수선합니다. 빠른 수리, 정직한 가격. 구시가지 7번가로 오십시요.</p>
      </div>

      <div class="bn-flyer" style="transform:rotate(-1.4deg); background:#F6F0E4;">
        <div class="bn-tape" style="left:50%; margin-left:-22px; transform:rotate(1deg);"></div>
        <h3 style="font-family:'Black Han Sans', sans-serif; font-weight:400; font-size:17px; color:var(--bn-accent);">★만병통치☆마법시럽★</h3>
        <p>불면증, 우울, 잡생각까지✹한 방에✹</p>
        <p class="bn-fine">부작용 발현 시 책임지지 않습니다</p>
      </div>

      <div class="bn-flyer" style="transform:rotate(1.1deg); background:#F6F0E4;">
        <div class="bn-tape" style="left:20px; transform:rotate(-2deg);"></div>
        <h3 style="font-family:'Gaegu', sans-serif;">긒젆✢융통</h3>
        <p style="font-family:'Gaegu', sans-serif;">묻ㅈㅣ도 ㄸr지지do 않습니다. 친절☻상담_당1데출</p>
      </div>

      <div class="bn-flyer" style="transform:rotate(0.6deg); border-style:solid; border-color:var(--bn-accent);">
        <div class="bn-tape" style="right:24px; left:auto; transform:rotate(3deg);"></div>
        <h3><span style="color:var(--bn-accent);">[급구]</span> 뱀파이어 심장 팝니다. 말뚝 및 은 탄환 없음, 무손상</h3>
      </div>

      <div class="bn-flyer" style="transform:rotate(-1.8deg); background:#F1E7D8; border-color:var(--bn-accent); text-align:center;">
        <div class="bn-tape" style="left:50%; margin-left:-20px; transform:rotate(-2deg);"></div>
        <h3 style="font-family:'Song Myung', serif; font-weight:400; font-size:16px; letter-spacing:3px; color:var(--bn-accent);">🪬 예언 · 주술 · 저주 · 애정운 · 사업운 🪤</h3>
        <p class="bn-fine" style="font-family:'Gaegu', sans-serif; font-size:9px;">상담료는 만족하신 뒤에</p>
      </div>

    </div>

    <div id="bn-footer" class="bn-footer"></div>

  </div>
</div>

<script src="common.js"></script>
</body>
</html>
